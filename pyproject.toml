[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redi-ml-project"
version = "0.2.0"
description = "Small, reproducible starter for an educational ML product"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2", "numpy>=1.26,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
app = ["streamlit>=1.39,<2", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/redi_ml_project"]

[tool.ruff]
line-length = 99
